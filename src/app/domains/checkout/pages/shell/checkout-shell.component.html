<div class="mx-auto max-w-6xl px-4 py-8">

  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-3xl font-bold text-gray-900">Checkout</h1>
    <span class="text-sm text-gray-500">Order subtotal ({{ subtotal() | currency }})</span>
  </div>

  <div class="mb-6 rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
    <div class="mb-2 flex items-center justify-between text-sm">
      <span class="font-semibold text-gray-800">Step {{ currentStep() }} of 4</span>
      <span class="text-gray-500">{{ progressPercent }}% complete</span>
    </div>
    <div class="h-2 w-full overflow-hidden rounded-full bg-gray-100">
      <div
        class="h-full rounded-full bg-blue-600 transition-all duration-300"
        [style.width.%]="progressPercent"
        [attr.aria-valuemin]="0"
        [attr.aria-valuemax]="100"
        [attr.aria-valuenow]="progressPercent"
        role="progressbar">
      </div>
    </div>
    <p class="mt-2 text-xs text-gray-500">Current step: {{ stepLabel }}</p>
  </div>

  <div class="grid grid-cols-1 gap-6 lg:grid-cols-[1fr_320px]">

    <div class="flex flex-col gap-3">
      <app-checkout-step-shipping-address
        [isActive]="currentStep() === 1"
        [isCompleted]="currentStep() > 1"
        [form]="shippingForm"
        (edit)="goToStep(1)"
        (continueStep)="continueToShippingMethod()">
      </app-checkout-step-shipping-address>

      <app-checkout-step-shipping-method
        [isActive]="currentStep() === 2"
        [isCompleted]="currentStep() > 2"
        [selectedShipping]="selectedShipping()"
        (edit)="goToStep(2)"
        (shippingChange)="selectedShipping.set($event)"
        (continueStep)="continueToPayment()">
      </app-checkout-step-shipping-method>

      <app-checkout-step-payment
        [isActive]="currentStep() === 3"
        [isCompleted]="currentStep() > 3"
        [selectedPayment]="selectedPayment()"
        (edit)="goToStep(3)"
        (paymentChange)="selectedPayment.set($event)"
        (continueStep)="continueToReview()">
      </app-checkout-step-payment>

      <app-checkout-step-review
        [isActive]="currentStep() === 4"
        [addressText]="shippingAddressSummary"
        [selectedShipping]="selectedShipping()"
        [selectedPayment]="selectedPayment()"
        (placeOrder)="placeOrder()">
      </app-checkout-step-review>

    </div>

    <div class="sticky top-4 self-start rounded-lg border border-gray-200 bg-gray-50/50 p-3">
      <h2 class="mb-3 text-base font-bold text-gray-800">Summary</h2>
      <app-order-summary />
    </div>

  </div>
</div>
