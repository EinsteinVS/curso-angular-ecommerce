<div class="group overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
    <a [routerLink]="['/product', product.id]" class="block w-full overflow-hidden bg-gray-100">
        <img [src]="product.images[0]" [alt]="product.title" class="h-40 w-full object-cover object-center transition duration-300 group-hover:scale-105">
    </a>
    <div class="flex flex-col space-y-2 p-4">
        <h3 class="line-clamp-2 min-h-[2.5rem] text-sm font-medium text-gray-800">{{ product.title }}</h3>
        <p class="text-base font-semibold text-red-500">{{product.price | currency:'$':'symbol':'1.0' }}</p>
        <p class="text-xs font-medium uppercase tracking-wide text-gray-400">{{product.creationAt | timeAgo}}</p>
        <button class="w-full rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-800"
            (click)="addToCartHandler()">Add to cart</button>
    </div>
</div>
