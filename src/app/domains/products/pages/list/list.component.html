<div class="mt-4 grid grid-cols-1 gap-6 lg:grid-cols-[220px_1fr]">
    <aside class="h-fit rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
        <p class="mb-3 text-xs font-semibold uppercase tracking-wide text-gray-500">Categorias</p>
        <ul class="space-y-2 text-sm">
            <li>
                <a routerLink="/"
                    class="block rounded px-2 py-1 hover:bg-gray-100"
                    [class]="!category_id ? 'bg-slate-900 text-white font-semibold' : 'text-gray-700'"
                >All</a>
            </li>
            @for (category of categories(); track category) {
                 <li>
                <a
                    routerLink="/"
                    [queryParams]="{category_id: category.id}"
                    class="block rounded px-2 py-1 hover:bg-gray-100"
                    [class]="category_id == category.id.toString() ? 'bg-slate-900 text-white font-semibold' : 'text-gray-700'"
                >{{ category.name }}</a>
                </li>
            }
        </ul>
    </aside>
    <section class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        @for (product of products(); track product) {
            <app-product
            [product]="product"
            (addToCart)="addToCart($event)" />
        }
    </section>
    
</div>
