<div class="flex min-h-[calc(100vh-130px)] items-center justify-center py-10">
  <div class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-8 shadow-sm">

    <!-- Header -->
    <div class="mb-6 text-center">
      <img class="mx-auto mb-4 h-8 w-auto" src="./assets/svg/logo_yard_sale.svg" alt="Yard Sale">
      <h1 class="text-xl font-bold text-gray-800">Iniciar sesión</h1>
      <p class="mt-1 text-sm text-gray-500">Bienvenido de nuevo</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>

      <!-- Email -->
      <div>
        <label class="mb-1 block text-xs font-medium text-gray-600">Correo electrónico <span class="text-red-400">*</span></label>
        <input
          type="email"
          formControlName="email"
          placeholder="juan@ejemplo.com"
          class="w-full rounded border px-3 py-2 text-sm text-gray-800 outline-none transition
            focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200"
          [class.border-red-400]="f['email'].invalid && f['email'].touched"
          [class.border-gray-300]="!(f['email'].invalid && f['email'].touched)"
        >
        @if (f['email'].invalid && f['email'].touched) {
          <p class="mt-1 text-xs text-red-400">Introduce un correo válido.</p>
        }
      </div>

      <!-- Contraseña -->
      <div>
        <div class="mb-1 flex items-center justify-between">
          <label class="text-xs font-medium text-gray-600">Contraseña <span class="text-red-400">*</span></label>
          <a routerLink="/" class="text-xs text-indigo-600 hover:underline">¿Olvidaste tu contraseña?</a>
        </div>
        <input
          type="password"
          formControlName="password"
          placeholder="Mín. 8 caracteres"
          class="w-full rounded border px-3 py-2 text-sm text-gray-800 outline-none transition
            focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200"
          [class.border-red-400]="f['password'].invalid && f['password'].touched"
          [class.border-gray-300]="!(f['password'].invalid && f['password'].touched)"
        >
        @if (f['password'].invalid && f['password'].touched) {
          <p class="mt-1 text-xs text-red-400">Mínimo 8 caracteres.</p>
        }
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="mt-2 w-full rounded bg-indigo-600 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700 active:bg-indigo-800"
      >
        Entrar
      </button>

    </form>

    <!-- Divider -->
    <div class="my-5 flex items-center gap-3">
      <div class="h-px flex-1 bg-gray-200"></div>
      <span class="text-xs text-gray-400">¿No tienes cuenta?</span>
      <div class="h-px flex-1 bg-gray-200"></div>
    </div>

    <a
      routerLink="/register"
      class="block w-full rounded border border-indigo-600 py-2.5 text-center text-sm font-semibold text-indigo-600 transition hover:bg-indigo-50"
    >
      Crear cuenta
    </a>

  </div>
</div>
