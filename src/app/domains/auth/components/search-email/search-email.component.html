<div 
  class="flex min-h-[calc(100vh-130px)] items-center justify-center py-5"
>
  <div class="w-full max-w-md rounded-xl border border-gray-200 bg-white p-8 shadow-sm">
    <form [formGroup]="formUser" (ngSubmit)="searchEmail()" class="flex flex-col gap-4" novalidate>
        <input
            type="email"
            formControlName="email"
            placeholder="juan@ejemplo.com"
            class="w-full rounded border px-3 py-2 text-sm text-gray-800 outline-none transition
              focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200"
            [class.border-red-400]="formUser.get('email')?.invalid && formUser.get('email')?.touched"
            [class.border-gray-300]="!(formUser.get('email')?.invalid && formUser.get('email')?.touched)"
        >        
        @if (formUser.get('email')?.invalid && formUser.get('email')?.touched) {
          <p class="mt-1 text-xs text-red-400">Introduce un correo válido.</p>
        }
        <!-- Submit -->
      <button
        type="submit"
        class="mt-2 w-full rounded bg-indigo-600 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-50"
      >
        Continue
      </button>

   </form>
  
  </div>
</div>
