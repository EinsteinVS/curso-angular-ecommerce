<!-- Eventuali banner o messaggi globali -->
<!-- Desktop (hidden on mobile, visible on md+) -->
<div class="hidden md:block border-b border-slate-700 bg-slate-900 text-slate-100">
  <div class="flex items-center justify-between gap-6 px-4 py-3">
    <nav class="flex items-center gap-6">
      <a class="mr-1" href="" aria-label="Home">
        <img class="h-5 w-auto brightness-0 invert" src="./assets/svg/logo_yard_sale.svg" alt="logo">
      </a>
      <ul class="flex items-center space-x-5 text-xs font-medium uppercase tracking-wide">
          <li>
            <a
              routerLink="/"
              routerLinkActive="underline"
              [routerLinkActiveOptions]="{exact: true}"
              class="block text-slate-100 hover:text-white hover:underline"
              aria-current="page"
              >Comprar por Tienda</a
            >
          </li>
          <li>
            <a
              routerLink="/about"
              routerLinkActive="underline"
              class="block text-slate-100 hover:text-white hover:underline"
              >Comprar por categoria</a
            >
          </li>
        </ul>
    </nav>
    <div class="flex min-w-[220px] flex-1 justify-center">
      <app-search></app-search>
    </div>
    <div class="flex items-center">
        <nav class="flex items-center">
     
            <ul class="flex items-center space-x-4 pr-4 text-xs">
                <li class="group relative"
                    (mouseenter)="openLoginMenu()"
                    (mouseleave)="closeLoginMenu()">
                    <button
                      type="button"
                      class="relative z-50 flex items-center gap-1 text-left text-slate-200 hover:text-white"
                      aria-haspopup="menu"
                    >
                      <span class="leading-4">
                        <span class="block text-[11px]">Hola.</span>
                        @if (authService.isLoggedIn()) {
                          <span class="block text-sm font-semibold">{{ authService.displayName() }}</span>
                        } @else {
                          <span class="block text-sm font-semibold">Inicia sesión</span>
                        }
                      </span>
                      <svg class="mt-3 h-3 w-3" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.94a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd" />
                      </svg>
                    </button>

                    <div
                      class="pointer-events-none fixed inset-0 z-40 bg-black/50 transition"
                      [class.invisible]="!showLoginMenu()"
                      [class.opacity-0]="!showLoginMenu()"
                      [class.opacity-100]="showLoginMenu()"
                      aria-hidden="true"
                    ></div>

                    <div
                      class="absolute right-0 top-full z-50 w-48 rounded bg-white py-3 text-slate-600 shadow-lg transition"
                      [class.invisible]="!showLoginMenu()"
                      [class.opacity-0]="!showLoginMenu()"
                      [class.opacity-100]="showLoginMenu()"
                      role="menu"
                    >
                      @if (authService.isLoggedIn()) {
                        <a routerLink="/account/dashboard" (click)="closeLoginMenu()" class="block px-5 py-2 text-sm hover:text-slate-900" role="menuitem">Mi cuenta</a>
                        <div class="my-2 border-t border-slate-200"></div>
                        <button
                          type="button"
                          (click)="logout()"
                          class="block w-full px-5 py-2 text-left text-sm hover:text-slate-900"
                          role="menuitem"
                        >
                          Cerrar sesión
                        </button>
                      } @else {
                        <a routerLink="/auth/login"
                          (click)="closeLoginMenu()"
                          class="block px-5 py-2 text-sm hover:text-slate-900" role="menuitem">
                          Inicia sesión
                        </a>
                        <a routerLink="/auth/register"
                          (click)="closeLoginMenu()"
                          class="block px-5 py-2 text-sm hover:text-slate-900"
                          role="menuitem">
                          Regístrate
                        </a>
                      }
                    </div>
                </li>
                <li>
                    <a
                    routerLink="/about"
                    routerLinkActive="underline"
                    class="block text-slate-200 hover:text-white hover:underline"
                    >Favoritos</a
                    >
                </li>
                <li>
                    <a
                    routerLink="/about"
                    routerLinkActive="underline"
                    class="block text-slate-200 hover:text-white hover:underline"
                    >call +39 32447 5887</a
                    >
                </li>
            </ul>
        </nav>
    <div class="mr-2 text-xs font-semibold text-red-400">Mi carrito</div>
    <app-cart></app-cart>
</div>


  </div>
</div>
