<div class="rounded-lg border border-gray-200 bg-white p-4">
  @for (item of cart(); track item.product.id) {
    <div class="flex items-center gap-4 border-b border-gray-100 py-4">
      <!-- Image -->
      <img
        class="h-16 w-16 flex-shrink-0 rounded-lg object-cover"
        [src]="item.product.images[0]"
        [alt]="item.product.title"
      >
      <!-- Title + controls -->
      <div class="flex flex-1 flex-col gap-2">
        <h3 class="text-sm font-semibold text-gray-800">{{ item.product.title }}</h3>
        <div class="flex items-center gap-2">
          <button
            class="flex h-7 w-7 items-center justify-center rounded border border-gray-300 text-gray-700 hover:bg-gray-100"
            (click)="decreaseQuantity(item.product.id)">-</button>
          <span class="min-w-6 text-center text-sm font-medium text-gray-800">{{ item.quantity }}</span>
          <button
            class="flex h-7 w-7 items-center justify-center rounded border border-gray-300 text-gray-700 hover:bg-gray-100"
            (click)="increaseQuantity(item.product.id)">+</button>
        </div>
      </div>
      <!-- Price + Remove -->
      <div class="flex flex-col items-end gap-1">
        <p class="text-sm font-bold text-gray-900">{{ item.product.price * item.quantity | currency:'$':'symbol':'1.0' }}</p>
        <button
          class="text-xs font-semibold text-red-500 underline underline-offset-2 hover:text-red-700"
          (click)="removeFromCart(item.product.id)">Remove</button>
      </div>
    </div>
  }
  <!-- Total -->
  <div class="flex items-center justify-between pt-4">
    <p class="text-base font-bold text-gray-900">Total: {{ total() | currency:'$':'symbol':'1.0' }}</p>
    <button
      class="text-xs font-medium text-gray-500 underline underline-offset-2 hover:text-gray-800"
      (click)="clearCart()">Clear</button>
  </div>
</div>
